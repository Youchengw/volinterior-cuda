name: package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install standalone CPU package
        run: python -m pip install .
      - name: Check installed entry point
        run: volinterior-cuda --help
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir /tmp/wheels
