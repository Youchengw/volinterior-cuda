[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volinterior-cuda"
version = "0.2.0"
description = "Screened CUDA connectivity with user-selected fixed or fuzzy DDA fallback for capsid trajectories"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
trajectory = ["MDAnalysis>=2.6"]
cuda = ["cupy-cuda12x[ctk]>=14.1.1,<15"]

[project.scripts]
volinterior-cuda = "volinterior_cuda.cli:main"

[tool.setuptools]
packages = ["volinterior_cuda"]
